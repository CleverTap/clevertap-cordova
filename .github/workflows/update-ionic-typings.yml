name: update-ionic-typings

# Manually-dispatched: update the CleverTap typings in awesome-cordova-plugins
# (ionic-native) so Ionic/Angular apps can call the latest Cordova plugin
# methods. Routes to the reusable workflow in clevertap-wrapper-tooling, which
# edits the typings repo and opens PR #1 there. The upstream PR (typings fork ->
# danielsogl/awesome-cordova-plugins) is raised by a human afterwards. The
# next-steps job prints those manual steps in the run log and summary.
#
# Required repo secrets: CLEVERTAP_WRAPPER_SYNC_APP_ID,
# CLEVERTAP_WRAPPER_SYNC_PRIVATE_KEY, ANTHROPIC_API_KEY. SLACK_WEBHOOK_URL is
# optional (failure pings are skipped without it).
# The clevertap-wrapper-sync App must be installed on the typings_repo.

on:
  workflow_dispatch:
    inputs:
      typings_repo:
        description: 'Typings repo to edit / open PR #1 into, as owner/name and not a URL (e.g. CleverTap/ionic-native). The App must be installed there.'
        type: string
        default: 'CleverTap/ionic-native'
      typings_base:
        description: 'Base branch in the typings repo.'
        type: string
        default: 'master'
      cordova_ref:
        description: 'Branch or release tag in THIS repo to read www/CleverTap.js + the ionic-native-typings skill from. A release tag (e.g. 5.3.0) gives a clearer PR title.'
        type: string
        default: 'master'
      release_name:
        description: 'Optional branch suffix (defaults to today YYYY-MM-DD).'
        type: string
        default: ''
      model:
        description: 'Claude model (alias)'
        type: choice
        options: [sonnet, opus, haiku]
        default: sonnet

jobs:
  # Resolve the branch suffix once and hand it to both jobs, so next-steps
  # looks up the same branch update-typings created even if the run crosses
  # midnight UTC.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.name.outputs.release_name }}
    steps:
      - name: Resolve release name
        id: name
        shell: bash
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          name="$RELEASE_NAME"
          [ -z "$name" ] && name=$(date -u +%Y-%m-%d)
          echo "release_name=$name" >> "$GITHUB_OUTPUT"

  update-typings:
    needs: resolve
    uses: CleverTap/clevertap-wrapper-tooling/.github/workflows/update-ionic-typings.yml@v1
    with:
      typings_repo:  ${{ inputs.typings_repo }}
      typings_base:  ${{ inputs.typings_base }}
      cordova_repo:  ${{ github.repository }}
      cordova_ref:   ${{ inputs.cordova_ref }}
      release_name:  ${{ needs.resolve.outputs.release_name }}
      model:         ${{ inputs.model }}
    secrets:
      app_id:            ${{ secrets.CLEVERTAP_WRAPPER_SYNC_APP_ID }}
      app_private_key:   ${{ secrets.CLEVERTAP_WRAPPER_SYNC_PRIVATE_KEY }}
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # A job that calls a reusable workflow can't have its own steps, so the
  # manual follow-up is printed from this separate job once the PR is raised.
  next-steps:
    needs: [resolve, update-typings]
    runs-on: ubuntu-latest
    steps:
      - name: Print the manual follow-up steps
        shell: bash
        env:
          GH_TOKEN:     ${{ github.token }}
          TYPINGS_REPO: ${{ inputs.typings_repo }}
          TYPINGS_BASE: ${{ inputs.typings_base }}
          RELEASE_NAME: ${{ needs.resolve.outputs.release_name }}
        run: |
          # Same branch name the reusable workflow builds from release_name.
          branch="task/clevertap-typings-${RELEASE_NAME}"
          owner="${TYPINGS_REPO%%/*}"
          upstream="danielsogl/awesome-cordova-plugins"

          pr_url=$(gh pr list --repo "$TYPINGS_REPO" --head "$branch" --state all --json url --jq '.[0].url' 2>/dev/null || true)
          if [ -z "$pr_url" ]; then
            echo "::warning::No typings PR found for $branch in $TYPINGS_REPO. If update-typings said there were no typings changes, there is nothing to do."
            pr_url="https://github.com/${TYPINGS_REPO}/pulls"
          fi

          {
            echo "## Next steps"
            echo ""
            echo "1. Review and merge the typings PR into the fork's \`${TYPINGS_BASE}\`: ${pr_url}"
            echo "2. Open a PR from \`${owner}:${TYPINGS_BASE}\` into \`${upstream}\` \`main\`: https://github.com/${upstream}/compare/main...${owner}:${TYPINGS_BASE}"
            echo "   Check the fork is in sync with upstream \`main\` first, so the PR only carries the CleverTap typings change. This is how ${upstream}#4938 was raised."
          } | tee -a "$GITHUB_STEP_SUMMARY"
